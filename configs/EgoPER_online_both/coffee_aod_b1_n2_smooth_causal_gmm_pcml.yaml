dataset_name: EgoPER
train_split: training
val_split: validation
test_split: test
model_name: LocPointTransformer_GMM_CAUSAL_SMOOTH_GCN_PCML
devices: ['cuda:1']
mode: online
dataset: {
  num_classes: 16,
  trunc_thresh: 0.5,
  crop_ratio: [0.9, 1.0],
  max_seq_len: 2304,
  background_ratio: 1.0,
  use_gcn: true,
  task: coffee
}
model: {
  # 保持与原模型一致的主干与FPN设置
  fpn_type: identity,
  backbone_type: convGCNTransformer,
  gcn_type: GCN,
  backbone_arch: [2, 2, 5],
  embd_kernel_size: 3,
  embd_dim: 512,
  n_head: 8,
  max_buffer_len_factor: 6.0,
  n_mha_win_size: 19,

  # GMM与任务图（与原配置一致）
  num_components: 2,
  smooth_type: gaussian,
  sigma: 4,
  task_graph_nodes: 20,
  task_name: coffee,

  # PCML参数（已启用）
  use_pcml: true,
  pcml_num_heads: 8,
  pcml_mini_batch_size: 64,
  pcml_rope_theta: 10000.0
}
opt: {
  learning_rate: 0.001,
  epochs: 200,
  weight_decay: 0.05,
  schedule_gamma: 0.7
}
loader: { batch_size: 1 }
train_cfg: {
  init_loss_norm: 200,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  gmm: true,
  center_sample_radius: 1.5,

  # 保持原有训练技巧字段，避免KeyError
  dropout: 0.0,
  droppath: 0.0,
  label_smoothing: 0.0,
  cl_weight: 0.0,
  head_empty_cls: [],

  # 对比学习相关键（PCML版本中类会读取）
  contrastive: false,
  num_negative_segments: 50
}
test_cfg: {
  pre_nms_thresh: 0.001,
  pre_nms_topk: 2000,
  iou_threshold: 0.6,
  min_score: 0.001,

  nms_method: soft,
  duration_thresh: 0.1,
  multiclass_nms: true,
  nms_sigma: 0.5,
  voting_thresh: 0.7
}
output_folder: ./ckpt/EgoPER_taskgraph_pcml/